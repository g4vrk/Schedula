[versions]

paper-api = "1.18.2-R0.1-SNAPSHOT"
folia-api = "1.21.11-R0.1-SNAPSHOT"

minecraft = "1.18.2"

lombok = "1.18.48"

shadow = "9.6.1"
run-task = "3.0.2"

junit = "6.1.3"
junit-platform = "6.1.3"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
folia-api = { module = "io.papermc.paper:paper-api", version.ref = "folia-api" }

lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
